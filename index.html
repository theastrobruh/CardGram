<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TCG:HUB — 3D Studio</title>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, "Lucida Grande", Verdana, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      /* Windows XP Luna / Frutiger Aero Gloss Palette */
      --xp-blue-dark: #0f3d7e;
      --xp-blue-mid: #2563eb;
      --xp-blue-light: #60a5fa;
      --xp-cyan-aero: #38bdf8;
      --xp-green-start: #22c55e;
      --xp-panel-glass: rgba(18, 30, 52, 0.78);
      --xp-panel-border: rgba(125, 185, 255, 0.35);
      --xp-highlight: rgba(255, 255, 255, 0.25);
      --gloss-grad: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.15) 51%, rgba(0,0,0,0.25) 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #0d1b2a 0%, #060911 70%, #020408 100%);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Frutiger Aero Scanline Overlay (Subtle retro screen shine) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
      background-size: 100% 4px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Mobile toggle button */
    #mobile-toggle-btn {
      display: none;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 100;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.85) 0%, rgba(15, 61, 126, 0.95) 100%);
      border: 1px solid var(--xp-panel-border);
      color: #fff;
      font-size: 1.2rem;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    /* -------------------------------------------------------------
       COSMIC BREATHING LOGO FX (UNIVERSE + RESPIRATION LOOP)
    ------------------------------------------------------------- */
    .brand-wrap {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cosmic-orb-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 35% 30%, #67e8f9 0%, #3b82f6 45%, #1e1b4b 85%, #050515 100%);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6), inset 0 1px 3px rgba(255, 255, 255, 0.8);
      animation: cosmicBreathe 4.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    .cosmic-orb-logo::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 4px;
      width: 10px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
      transform: rotate(-25deg);
    }

    .cosmic-orb-logo::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px dashed rgba(125, 211, 252, 0.6);
      animation: cosmicOrbit 12s linear infinite;
    }

    @keyframes cosmicBreathe {
      0%, 100% {
        transform: scale(0.92);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.4), 0 0 20px rgba(147, 51, 234, 0.3);
        filter: brightness(0.95);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.9), 0 0 32px rgba(168, 85, 247, 0.7);
        filter: brightness(1.25);
      }
    }

    @keyframes cosmicOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(180deg, #ffffff 30%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.4);
    }

    .author-credit {
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      color: rgba(148, 163, 184, 0.7);
      margin-left: 36px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
    }

    /* -------------------------------------------------------------
       CINEMATIC MODE BUTTON (ICON ONLY - EYE/CAMERA GLYPH)
    ------------------------------------------------------------- */
    #btn-cinematic {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 90;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(30, 41, 59, 0.8) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid var(--xp-panel-border);
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    #btn-cinematic:hover {
      transform: scale(1.1) rotate(5deg);
      border-color: var(--xp-cyan-aero);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }

    #cinematic-exit-tip {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #cbd5e1;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      z-index: 200;
      pointer-events: none;
      animation: fadeInOut 3s forwards;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; }
      15% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* -------------------------------------------------------------
       SIDEBAR & WINDOWS XP x FRUTIGER AERO STYLING
    ------------------------------------------------------------- */
    #sidebar {
      width: 410px;
      min-width: 380px;
      max-width: 420px;
      background: var(--xp-panel-glass);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--xp-panel-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 50;
      box-shadow: 12px 0 35px rgba(0, 0, 0, 0.6), inset -1px 0 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* XP Window Header Bar */
    .header {
      padding: 14px 18px;
      background: linear-gradient(180deg, #1e40af 0%, #1d4ed8 45%, #1e3a8a 55%, #172554 100%);
      border-bottom: 1px solid rgba(125, 211, 252, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 2px 8px rgba(0,0,0,0.4);
    }

    .lang-switcher {
      display: flex;
      background: rgba(10, 16, 30, 0.6);
      border: 1px solid var(--xp-panel-border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #030712;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .scroll-content {
      padding: 14px 18px;
      overflow-y: auto;
      flex: 1;
    }
    .scroll-content::-webkit-scrollbar {
      width: 8px;
    }
    .scroll-content::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(96, 165, 250, 0.4), rgba(30, 58, 138, 0.6));
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fde047;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      margin-bottom: 8px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title:first-child {
      margin-top: 0;
    }

    /* Cards Presets Quickbar (Saved sets) */
    .card-presets-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .preset-chip {
      background: linear-gradient(180deg, rgba(30, 58, 138, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid var(--xp-panel-border);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .preset-chip:hover, .preset-chip.active {
      border-color: var(--xp-cyan-aero);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.3) 0%, rgba(29, 78, 216, 0.6) 100%);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .preset-chip .del-btn {
      color: #f87171;
      font-weight: bold;
      margin-left: 2px;
    }

    /* Upload boxes */
    .upload-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .upload-box {
      flex: 1;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px dashed rgba(125, 211, 252, 0.4);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .upload-box:hover {
      border-color: var(--xp-cyan-aero);
      background: rgba(30, 58, 138, 0.35);
      transform: translateY(-1px);
    }
    .upload-box input {
      display: none;
    }
    .upload-box img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 4px;
      background: #020617;
      display: block;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .upload-box span {
      font-size: 0.74rem;
      color: #cbd5e1;
      display: block;
      font-weight: 600;
    }

    /* Aero Glass Card / Rows */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.45) 0%, rgba(15, 23, 42, 0.7) 100%);
      padding: 7px 11px;
      border-radius: 8px;
      border: 1px solid rgba(125, 211, 252, 0.2);
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .control-row label {
      font-size: 0.78rem;
      color: #e2e8f0;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .control-row-col {
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
    }
    .control-row-col .header-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider-val {
      font-size: 0.74rem;
      color: var(--xp-cyan-aero);
      font-weight: 700;
      font-family: monospace;
    }

    select, input[type="range"], input[type="text"] {
      background: #0f172a;
      border: 1px solid rgba(125, 211, 252, 0.3);
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      outline: none;
      cursor: pointer;
    }
    select:focus, input:focus {
      border-color: var(--xp-cyan-aero);
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.5);
    }
    input[type="range"] {
      width: 100%;
      height: 5px;
      accent-color: var(--xp-cyan-aero);
      padding: 0;
    }

    /* Luna / Aero Button Pills */
    .preset-pill-group {
      display: flex;
      gap: 5px;
      width: 100%;
    }
    .pill-btn {
      flex: 1;
      padding: 4px 6px;
      font-size: 0.72rem;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(125, 211, 252, 0.3);
      border-radius: 6px;
      color: #cbd5e1;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .pill-btn.active, .pill-btn:hover {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #030712;
      font-weight: 700;
      border-color: #38bdf8;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
    }

    /* Multi-scene Keyframe Layers (3 Scenes) */
    .scene-timeline-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 4px;
    }
    .scene-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(125, 211, 252, 0.25);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .scene-card.active {
      border-color: var(--xp-cyan-aero);
      background: rgba(14, 116, 144, 0.3);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
    .scene-card .scene-label {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 3px;
    }
    .scene-card .btn-set-cam {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      color: #cbd5e1;
      padding: 2px 4px;
      font-size: 0.65rem;
      cursor: pointer;
      margin-top: 3px;
      width: 100%;
    }
    .scene-card .btn-set-cam:hover {
      background: #0284c7;
      color: #fff;
    }

    /* Action footer with Frutiger/XP Gloss Green Button */
    .footer {
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
      border-top: 1px solid var(--xp-panel-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn-record {
      width: 100%;
      padding: 12px;
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 48%, #15803d 52%, #14532d 100%);
      color: #fff;
      border: 1px solid #86efac;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.5), inset 0 1px 0 rgba(255,255,255,0.6);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .btn-record:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn-record:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
      border-color: #64748b;
    }
    .status-text {
      text-align: center;
      font-size: 0.73rem;
      color: #94a3b8;
      margin-top: 7px;
    }

    /* -------------------------------------------------------------
       MAIN VIEWPORT & CANVAS CONTAINER
    ------------------------------------------------------------- */
    #viewport-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020408;
      overflow: hidden;
      padding: 16px;
    }

    #canvas-window-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 20px rgba(37, 99, 235, 0.25);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(125, 211, 252, 0.35);
      transition: width 0.25s ease, height 0.25s ease, border-radius 0.2s ease;
    }
    #canvas-window-wrapper canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* -------------------------------------------------------------
       RADIAL FLOWER FAB MENU (BOTTOM RIGHT OVERLAY)
    ------------------------------------------------------------- */
    .flower-fab-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 40;
    }

    .flower-main-trigger {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(180deg, #38bdf8 0%, #2563eb 50%, #1d4ed8 100%);
      border: 2px solid #bae6fd;
      color: #fff;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.7), inset 0 1px 0 rgba(255,255,255,0.7);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .flower-main-trigger:hover {
      transform: scale(1.08) rotate(15deg);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.9);
    }
    .flower-fab-container.open .flower-main-trigger {
      transform: rotate(45deg);
      background: linear-gradient(180deg, #f43f5e 0%, #be123c 100%);
      border-color: #fecdd3;
    }

    /* Petal buttons radiating outward */
    .flower-petals {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 40px;
      height: 40px;
      pointer-events: none;
    }
    .petal-btn {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(30, 58, 138, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
      backdrop-filter: blur(8px);
      border: 1px solid var(--xp-panel-border);
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
      opacity: 0;
      transform: translate(0, 0) scale(0.4);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    .petal-btn:hover {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #030712;
      transform: scale(1.15) !important;
      border-color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
    }

    /* Open states: fan out like a flower / peacock arc */
    .flower-fab-container.open .petal-btn {
      opacity: 1;
      pointer-events: auto;
    }
    /* Petal 1: Centrar (Center) - Straight Up */
    .flower-fab-container.open .petal-1 { transform: translate(0px, -65px) scale(1); transition-delay: 0.03s; }
    /* Petal 2: Invertir Giro (Reverse Spin) - Top Left */
    .flower-fab-container.open .petal-2 { transform: translate(-50px, -48px) scale(1); transition-delay: 0.06s; }
    /* Petal 3: Nivelar Inclinación (Center Tilt) - Far Left */
    .flower-fab-container.open .petal-3 { transform: translate(-70px, 0px) scale(1); transition-delay: 0.09s; }
    /* Petal 4: Giro Intenso (Turbo Spin) - Low Left */
    .flower-fab-container.open .petal-4 { transform: translate(-50px, 50px) scale(1); transition-delay: 0.12s; }
    /* Petal 5: Guardar Pose Rápida (Save Pose) - Top-Right slant */
    .flower-fab-container.open .petal-5 { transform: translate(45px, -50px) scale(1); transition-delay: 0.15s; }

    /* Tooltip banner for flower buttons */
    .petal-btn::after {
      content: attr(data-tip);
      position: absolute;
      right: 50px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--xp-panel-border);
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .petal-btn:hover::after {
      opacity: 1;
    }

    /* -------------------------------------------------------------
       CINEMATIC MODE ACTIVE OVERRIDES
    ------------------------------------------------------------- */
    body.cinematic-mode #sidebar,
    body.cinematic-mode #mobile-toggle-btn,
    body.cinematic-mode #btn-cinematic,
    body.cinematic-mode .flower-fab-container {
      display: none !important;
    }
    body.cinematic-mode #viewport-container {
      padding: 0 !important;
    }
    body.cinematic-mode #canvas-window-wrapper {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    /* Mobile Responsive styling */
    @media (max-width: 860px) {
      #mobile-toggle-btn {

    let currentLang = 'es';

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-lang-es').classList.toggle('active', lang === 'es');
      document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
    }

    document.getElementById('btn-lang-es').addEventListener('click', () => setLanguage('es'));
    document.getElementById('btn-lang-en').addEventListener('click', () => setLanguage('en'));

    // -------------------------------------------------------------------------
    // 3D SCENE SETUP WITH THREE.JS
    // -------------------------------------------------------------------------
    const container = document.getElementById('viewport-container');
    const canvasWrapper = document.getElementById('canvas-window-wrapper');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    let camDistance = 4.6;
    let cardPosY = 0.0;
    let spinDir = 1; // 1 or -1
    let tiltMultiplier = 1.0;

    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.set(0, 0, camDistance);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputEncoding = THREE.sRGBEncoding;
    canvasWrapper.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.autoRotate = false;

    // Lighting Rig with Aero Gloss touch
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(3, 4, 4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7dd3fc, 1.0);
    fillLight.position.set(-3, -1, 3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffedd5, 1.6);
    rimLight.position.set(0, 4, -3);
    scene.add(rimLight);

    // -------------------------------------------------------------------------
    // PROCEDURAL CARD GEOMETRY & MATERIALS
    // -------------------------------------------------------------------------
    const cardGroup = new THREE.Group();
    scene.add(cardGroup);

    const textureLoader = new THREE.TextureLoader();
    let currentFrontSrc = 'assets/card_front.png';
    let currentBackSrc = 'assets/card_back.png';

    let frontTex = textureLoader.load(currentFrontSrc);
    let backTex = textureLoader.load(currentBackSrc);
    frontTex.encoding = THREE.sRGBEncoding;
    backTex.encoding = THREE.sRGBEncoding;

    let matFront = new THREE.MeshStandardMaterial({
      map: frontTex,
      roughness: 0.25,
      metalness: 0.05
    });

    let matBack = new THREE.MeshStandardMaterial({
      map: backTex,
      roughness: 0.25,
      metalness: 0.05
    });

    let matEdge = new THREE.MeshStandardMaterial({
      color: 0x050505,
      roughness: 0.4,
      metalness: 0.1
    });

    const cardParams = {
      w: 1.35,
      h: 1.89,
      isRounded: true,
      thickness: 0.016,
      bevelSize: 0.004
    };

    function rebuildCard() {
      while (cardGroup.children.length > 0) {
        const obj = cardGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        cardGroup.remove(obj);
      }

      const w = cardParams.w;
      const h = cardParams.h;
      const radius = cardParams.isRounded ? 0.09 : 0.0001;
      const depth = cardParams.thickness;
      const bevel = cardParams.bevelSize;

      const shape = new THREE.Shape();
      const x = -w / 2;
      const y = -h / 2;

      shape.moveTo(x + radius, y);
      shape.lineTo(x + w - radius, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + radius);
      shape.lineTo(x + w, y + h - radius);
      shape.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      shape.lineTo(x + radius, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - radius);
      shape.lineTo(x, y + radius);
      shape.quadraticCurveTo(x, y, x + radius, y);

      const extrudeSettings = {
        depth: depth,
        bevelEnabled: bevel > 0.0005,
        bevelSegments: 4,
        steps: 1,
        bevelSize: bevel,
        bevelThickness: bevel
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geometry.center();

      const pos = geometry.attributes.position;
      const uv = geometry.attributes.uv;
      const totalHalfDepth = (depth / 2) + (bevel > 0.0005 ? bevel : 0);
      const outerW = w + bevel * 2;
      const outerH = h + bevel * 2;

      for (let i = 0; i < pos.count; i++) {
        const px = pos.getX(i);
        const py = pos.getY(i);
        const pz = pos.getZ(i);

        const u = Math.min(Math.max((px / outerW) + 0.5, 0), 1);
        const v = Math.min(Math.max((py / outerH) + 0.5, 0), 1);

        if (pz > 0.001) {
          uv.setXY(i, u, v);
        } else if (pz < -0.001) {
          uv.setXY(i, 1.0 - u, v);
        } else {
          uv.setXY(i, 0.5, 0.5);
        }
      }
      uv.needsUpdate = true;

      const cardBody = new THREE.Mesh(geometry, [matFront, matEdge]);
      cardGroup.add(cardBody);

      // ShapeGeometry face plates ensure seamless rounded borders
      const faceGeo = new THREE.ShapeGeometry(shape, 32);
      const facePos = faceGeo.attributes.position;
      const faceUV = faceGeo.attributes.uv;
      for (let i = 0; i < facePos.count; i++) {
        const px = facePos.getX(i);
        const py = facePos.getY(i);
        faceUV.setXY(i, (px / w) + 0.5, (py / h) + 0.5);
      }
      faceUV.needsUpdate = true;

      const frontFace = new THREE.Mesh(faceGeo, matFront);
      frontFace.position.z = totalHalfDepth + 0.0004;
      cardGroup.add(frontFace);

      const backGeo = faceGeo.clone();
      const backUV = backGeo.attributes.uv;
      for (let i = 0; i < backUV.count; i++) {
        backUV.setX(i, 1.0 - backUV.getX(i));
      }
      backUV.needsUpdate = true;

      const backFace = new THREE.Mesh(backGeo, matBack);
      backFace.position.z = -totalHalfDepth - 0.0004;
      backFace.rotation.y = Math.PI;
      cardGroup.add(backFace);
    }

    rebuildCard();

    // -------------------------------------------------------------------------
    // SCENE CAMERA POSES & TRANSITIONS (UP TO 3 SCENES)
    // -------------------------------------------------------------------------
    const scenesData = {
      1: { pos: new THREE.Vector3(0, 0, 4.6), target: new THREE.Vector3(0, 0, 0), cardY: 0 },
      2: { pos: new THREE.Vector3(1.8, 1.2, 3.2), target: new THREE.Vector3(0, 0.3, 0), cardY: 0.1 },
      3: { pos: new THREE.Vector3(-1.4, -0.6, 2.6), target: new THREE.Vector3(0, -0.2, 0), cardY: -0.1 }
    };

    let activeSceneIdx = 1;
    let isTransitioning = false;
    let transitionStartTime = 0;
    let transitionDuration = 1.2; // seconds
    let transStartCam = new THREE.Vector3();
    let transTargetCam = new THREE.Vector3();
    let transStartCtrl = new THREE.Vector3();
    let transTargetCtrl = new THREE.Vector3();

    function applyScene(idx) {
      activeSceneIdx = idx;
      document.querySelectorAll('.scene-card').forEach(c => {
        c.classList.toggle('active', parseInt(c.getAttribute('data-scene')) === idx);
      });

      const s = scenesData[idx];
      transStartCam.copy(camera.position);
      transTargetCam.copy(s.pos);
      transStartCtrl.copy(controls.target);
      transTargetCtrl.copy(s.target);
      cardPosY = s.cardY;
      document.getElementById('range-pos-y').value = cardPosY;
      document.getElementById('val-pos-y').textContent = cardPosY.toFixed(2);

      transitionStartTime = performance.now();
      isTransitioning = true;
    }

    document.querySelectorAll('.scene-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-set-cam')) return;
        const idx = parseInt(card.getAttribute('data-scene'));
        applyScene(idx);
      });
    });

    document.querySelectorAll('.btn-set-cam').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.getAttribute('data-set-scene'));
        scenesData[idx].pos.copy(camera.position);
        scenesData[idx].target.copy(controls.target);
        scenesData[idx].cardY = cardPosY;
        btn.textContent = "✅ Guardado";
        setTimeout(() => { btn.textContent = "📸 Grabar Pose"; }, 1500);
      });
    });

    // Multi-scene sequence player
    let isSequencePlaying = false;
    document.getElementById('btn-play-scenes').addEventListener('click', () => {
      if (isSequencePlaying) return;
      isSequencePlaying = true;
      document.getElementById('btn-play-scenes').textContent = "⏳ Ejecutando Tomas...";

      applyScene(1);
      setTimeout(() => {
        applyScene(2);
        setTimeout(() => {
          applyScene(3);
          setTimeout(() => {
            isSequencePlaying = false;
            document.getElementById('btn-play-scenes').textContent = "▶️ Transición 3 Tomas";
          }, 2400);
        }, 2400);
      }, 2400);
    });

    // -------------------------------------------------------------------------
    // ANIMATION & RENDER LOOP
    // -------------------------------------------------------------------------
    let clock = new THREE.Clock();
    let isFloating = true;
    let speedMult = 1.0;

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Camera smooth interpolation during scene switches
      if (isTransitioning) {
        const progress = Math.min((performance.now() - transitionStartTime) / (transitionDuration * 1000), 1.0);
        // Smooth step easing
        const t = progress * progress * (3 - 2 * progress);
        camera.position.lerpVectors(transStartCam, transTargetCam, t);
        controls.target.lerpVectors(transStartCtrl, transTargetCtrl, t);
        if (progress >= 1.0) {
          isTransitioning = false;
        }
      }

      // Continuous spin with direction and speed control
      cardGroup.rotation.y += (0.018 * speedMult * spinDir);

      if (isFloating) {
        // Tilt with intensity multiplier
        cardGroup.rotation.x = Math.sin(elapsedTime * 1.5) * 0.12 * tiltMultiplier;
        cardGroup.rotation.z = Math.cos(elapsedTime * 1.2) * 0.05 * tiltMultiplier;
        cardGroup.position.y = cardPosY + Math.sin(elapsedTime * 2.0) * 0.06;
      } else {
        cardGroup.rotation.x = 0;
        cardGroup.rotation.z = 0;
        cardGroup.position.y = cardPosY;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // -------------------------------------------------------------------------
    // CARD PRESETS MANAGER (LOCALSTORAGE INTEGRATION)
    // -------------------------------------------------------------------------
    let savedCardPresets = JSON.parse(localStorage.getItem('tcg_card_presets') || '[]');

    function renderCardPresets() {
      const bar = document.getElementById('card-presets-bar');
      bar.innerHTML = '<div class="preset-chip active" id="chip-default">Default TCG</div>';

      document.getElementById('chip-default').addEventListener('click', () => {
        document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
        document.getElementById('chip-default').classList.add('active');
        loadCardImages('assets/card_front.png', 'assets/card_back.png');
      });

      savedCardPresets.forEach((p, idx) => {
        const chip = document.createElement('div');
        chip.className = 'preset-chip';
        chip.innerHTML = `<span>${p.name}</span> <span class="del-btn" data-del="${idx}">&times;</span>`;

        chip.addEventListener('click', (e) => {
          if (e.target.classList.contains('del-btn')) {
            savedCardPresets.splice(idx, 1);
            localStorage.setItem('tcg_card_presets', JSON.stringify(savedCardPresets));
            renderCardPresets();
            return;
          }
          document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          loadCardImages(p.front, p.back);
        });

        bar.appendChild(chip);
      });
    }

    function loadCardImages(frontUrl, backUrl) {
      document.getElementById('front-preview-img').src = frontUrl;
      document.getElementById('back-preview-img').src = backUrl;

      textureLoader.load(frontUrl, (t) => {
        t.encoding = THREE.sRGBEncoding;
        matFront.map = t;
        matFront.needsUpdate = true;
      });

      textureLoader.load(backUrl, (t) => {
        t.encoding = THREE.sRGBEncoding;
        matBack.map = t;
        matBack.needsUpdate = true;
      });
    }

    document.getElementById('btn-save-card-preset').addEventListener('click', () => {
      const name = prompt(currentLang === 'es' ? 'Nombre para este preset de carta:' : 'Preset name:', `Card #${savedCardPresets.length + 1}`);
      if (name) {
        savedCardPresets.push({
          name: name.trim(),
          front: document.getElementById('front-preview-img').src,
          back: document.getElementById('back-preview-img').src
        });
        localStorage.setItem('tcg_card_presets', JSON.stringify(savedCardPresets));
        renderCardPresets();
      }
    });

    renderCardPresets();

    // -------------------------------------------------------------------------
    // RADIAL FLOWER FAB MENU LOGIC
    // -------------------------------------------------------------------------
    const flowerMenu = document.getElementById('flower-menu');
    const flowerTrigger = document.getElementById('flower-trigger');

    flowerTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      flowerMenu.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!flowerMenu.contains(e.target)) {
        flowerMenu.classList.remove('open');
      }
    });

    // Petal 1: Centrar
    document.getElementById('petal-center').addEventListener('click', () => {
      controls.target.set(0, 0, 0);
      camera.position.set(0, 0, camDistance);
      controls.update();
      flowerMenu.classList.remove('open');
    });

    // Petal 2: Invertir Giro
    document.getElementById('petal-reverse').addEventListener('click', () => {
      spinDir *= -1;
      document.getElementById('select-spin-dir').value = spinDir.toString();
      flowerMenu.classList.remove('open');
    });

    // Petal 3: Nivelar Inclinación (0 tilt)
    document.getElementById('petal-level').addEventListener('click', () => {
      tiltMultiplier = (tiltMultiplier === 0 ? 1.0 : 0.0);
      document.getElementById('range-tilt-intensity').value = tiltMultiplier;
      document.getElementById('val-tilt-intensity').textContent = tiltMultiplier.toFixed(1);
      flowerMenu.classList.remove('open');
    });

    // Petal 4: Giro Turbo (Toggle Speed)
    document.getElementById('petal-turbo').addEventListener('click', () => {
      speedMult = (speedMult === 2.0 ? 1.0 : 2.0);
      document.getElementById('select-speed').value = speedMult.toString();
      flowerMenu.classList.remove('open');
    });

    // Petal 5: Guardar Pose Rápida en Toma 1
    document.getElementById('petal-save-pose').addEventListener('click', () => {
      scenesData[1].pos.copy(camera.position);
      scenesData[1].target.copy(controls.target);
      scenesData[1].cardY = cardPosY;
      alert(currentLang === 'es' ? 'Pose guardada en Toma 1!' : 'Camera Pose saved to Scene 1!');
      flowerMenu.classList.remove('open');
    });

    // -------------------------------------------------------------------------
    // DYNAMIC CANVAS SIZING & PRESETS
    // -------------------------------------------------------------------------
    let currentAspectRatio = 9 / 16;
    let currentScalePercent = 100;

    function resizeCanvas() {
      const availW = container.clientWidth;
      const availH = container.clientHeight;

      let targetW, targetH;

      if (document.body.classList.contains('cinematic-mode')) {
        targetW = window.innerWidth;
        targetH = window.innerHeight;
      } else if (currentAspectRatio === 'fill') {
        targetW = availW * (currentScalePercent / 100);
        targetH = availH * (currentScalePercent / 100);
      } else {
        const scaleFactor = (currentScalePercent / 100);
        const maxW = availW * scaleFactor;
        const maxH = availH * scaleFactor;

        if (maxW / maxH > currentAspectRatio) {
          targetH = maxH;
          targetW = maxH * currentAspectRatio;
        } else {
          targetW = maxW;
          targetH = maxW / currentAspectRatio;
        }
      }

      targetW = Math.max(Math.round(targetW), 100);
      targetH = Math.max(Math.round(targetH), 100);

      canvasWrapper.style.width = `${targetW}px`;
      canvasWrapper.style.height = `${targetH}px`;

      camera.aspect = targetW / targetH;
      camera.updateProjectionMatrix();
      renderer.setSize(targetW, targetH, false);
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    document.querySelectorAll('.preset-pill-group .pill-btn').forEach(btn => {
      if (!btn.hasAttribute('data-preset')) return;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-pill-group .pill-btn[data-preset]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const preset = btn.getAttribute('data-preset');
        if (preset === '9:16') currentAspectRatio = 9 / 16;
        else if (preset === '1:1') currentAspectRatio = 1.0;
        else if (preset === '16:9') currentAspectRatio = 16 / 9;
        else if (preset === 'fill') currentAspectRatio = 'fill';

        resizeCanvas();
      });
    });

    document.getElementById('range-canvas-scale').addEventListener('input', (e) => {
      currentScalePercent = parseInt(e.target.value, 10);
      resizeCanvas();
    });

    // -------------------------------------------------------------------------
    // CAMERA & DYNAMICS CONTROLS
    // -------------------------------------------------------------------------
    document.getElementById('range-cam-dist').addEventListener('input', (e) => {
      camDistance = parseFloat(e.target.value);
      document.getElementById('val-cam-dist').textContent = camDistance.toFixed(1);
      const dir = camera.position.clone().sub(controls.target).normalize();
      camera.position.copy(controls.target).add(dir.multiplyScalar(camDistance));
    });

    document.getElementById('range-pos-y').addEventListener('input', (e) => {
      cardPosY = parseFloat(e.target.value);
      document.getElementById('val-pos-y').textContent = cardPosY.toFixed(2);
    });

    document.getElementById('select-spin-dir').addEventListener('change', (e) => {
      spinDir = parseInt(e.target.value);
    });

    document.getElementById('range-tilt-intensity').addEventListener('input', (e) => {
      tiltMultiplier = parseFloat(e.target.value);
      document.getElementById('val-tilt-intensity').textContent = tiltMultiplier.toFixed(1);
    });

    // -------------------------------------------------------------------------
    // CARD 3D ATTRIBUTES (THICKNESS, BEVEL, GLOSS, CORNERS)
    // -------------------------------------------------------------------------
    document.getElementById('range-edge-thickness').addEventListener('input', (e) => {
      cardParams.thickness = parseFloat(e.target.value);
      document.getElementById('val-edge-thick').textContent = cardParams.thickness.toFixed(3);
      rebuildCard();
    });

    document.getElementById('range-bevel-intensity').addEventListener('input', (e) => {
      cardParams.bevelSize = parseFloat(e.target.value);
      document.getElementById('val-bevel-int').textContent = cardParams.bevelSize.toFixed(3);
      rebuildCard();
    });

    document.getElementById('select-corners').addEventListener('change', (e) => {
      cardParams.isRounded = (e.target.value === 'rounded');
      rebuildCard();
    });

    document.getElementById('select-edge').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'gold_foil') {
        matEdge.color.setHex(0xd4af37);
        matEdge.metalness = 0.95;
        matEdge.roughness = 0.18;
      } else if (val === 'silver_foil') {
        matEdge.color.setHex(0xdcdde1);
        matEdge.metalness = 0.98;
        matEdge.roughness = 0.15;
      } else if (val === 'white') {
        matEdge.color.setHex(0xf5f5f5);
        matEdge.metalness = 0.0;
        matEdge.roughness = 0.4;
      } else {
        matEdge.color.setHex(0x050505);
        matEdge.metalness = 0.1;
        matEdge.roughness = 0.4;
      }
      matEdge.needsUpdate = true;
    });

    document.getElementById('range-gloss').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      document.getElementById('val-gloss').textContent = v.toFixed(2);
      matFront.roughness = v;
      matBack.roughness = v;
    });

    // -------------------------------------------------------------------------
    // FILE UPLOADS
    // -------------------------------------------------------------------------
    document.getElementById('front-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        document.getElementById('front-preview-img').src = url;
        textureLoader.load(url, (t) => {
          t.encoding = THREE.sRGBEncoding;
          matFront.map = t;
          matFront.needsUpdate = true;
        });
      }
    });

    document.getElementById('back-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        document.getElementById('back-preview-img').src = url;
        textureLoader.load(url, (t) => {
          t.encoding = THREE.sRGBEncoding;
          matBack.map = t;
          matBack.needsUpdate = true;
        });
      }
    });

    // -------------------------------------------------------------------------
    // BACKGROUND & ENVIRONMENT (INCLUDING FRUTIGER AERO SKY)
    // -------------------------------------------------------------------------
    document.getElementById('select-bg').addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'black') {
        scene.background = new THREE.Color(0x000000);
      } else if (val === 'aero_sky') {
        scene.background = new THREE.Color(0x228be6); // Frutiger cyan-blue atmosphere
      } else if (val === 'dark_studio') {
        scene.background = new THREE.Color(0x060911);
      } else if (val === 'gold_luxury') {
        scene.background = new THREE.Color(0x130e06);
      } else if (val === 'cyber_neon') {
        scene.background = new THREE.Color(0x040817);
      } else if (val === 'transparent') {
        scene.background = null;
      }
    });

    document.getElementById('select-speed').addEventListener('change', (e) => {
      speedMult = parseFloat(e.target.value);
    });

    document.getElementById('toggle-floating').addEventListener('change', (e) => {
      isFloating = (e.target.value === 'true');
    });

    // -------------------------------------------------------------------------
    // CINEMATIC VIEWER MODE (CLEAN SCREEN RECORDING)
    // -------------------------------------------------------------------------
    const btnCinematic = document.getElementById('btn-cinematic');
    const exitTip = document.getElementById('cinematic-exit-tip');

    function enterCinematic() {
      document.body.classList.add('cinematic-mode');
      resizeCanvas();
      exitTip.style.display = 'block';
      setTimeout(() => { exitTip.style.display = 'none'; }, 3000);
    }

    function exitCinematic() {
      if (document.body.classList.contains('cinematic-mode')) {
        document.body.classList.remove('cinematic-mode');
        exitTip.style.display = 'none';
        resizeCanvas();
      }
    }

    btnCinematic.addEventListener('click', enterCinematic);

    container.addEventListener('click', (e) => {
      if (document.body.classList.contains('cinematic-mode')) {
        exitCinematic();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('cinematic-mode')) {
        exitCinematic();
      }
    });

    // -------------------------------------------------------------------------
    // MOBILE DRAWER
    // -------------------------------------------------------------------------
    const mobileBtn = document.getElementById('mobile-toggle-btn');
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');

    mobileBtn.addEventListener('click', () => {
      const isOpen = sidebar.classList.toggle('open');
      backdrop.classList.toggle('active', isOpen);
    });
    backdrop.addEventListener('click', () => {
      sidebar.classList.remove('open');
      backdrop.classList.remove('active');
    });

    // -------------------------------------------------------------------------
    // 9:16 VERTICAL HD (1080x1920) RECORDER
    // -------------------------------------------------------------------------
    const btnRecord = document.getElementById('btn-record');
    const recordBtnText = document.getElementById('record-btn-text');
    const statusLabel = document.getElementById('status-label');

    btnRecord.addEventListener('click', async () => {
      btnRecord.disabled = true;
      statusLabel.textContent = translations[currentLang].status_recording;
      recordBtnText.textContent = "⏳ ...";

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 1080;
      exportCanvas.height = 1920;

      const exportRenderer = new THREE.WebGLRenderer({
        canvas: exportCanvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true
      });
      exportRenderer.setSize(1080, 1920, false);
      exportRenderer.toneMapping = THREE.ACESFilmicToneMapping;
      exportRenderer.toneMappingExposure = 1.15;
      exportRenderer.outputEncoding = THREE.sRGBEncoding;

      const exportCamera = new THREE.PerspectiveCamera(38, 1080 / 1920, 0.1, 100);
      exportCamera.position.copy(camera.position);
      exportCamera.quaternion.copy(camera.quaternion);
      exportCamera.aspect = 9 / 16;
      exportCamera.updateProjectionMatrix();

      const stream = exportCanvas.captureStream(30);
      const mime = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
                 ? 'video/mp4'
                 : MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                   ? 'video/webm;codecs=vp9'
                   : 'video/webm';

      const recorder = new MediaRecorder(stream, {
        mimeType: mime,
        videoBitsPerSecond: 12000000
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      const durationSec = 10;
      let isExporting = true;

      recorder.onstop = () => {
        const ext = mime.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(chunks, { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TCG_HUB_9x16_${Date.now()}.${ext}`;
        a.click();

        exportRenderer.dispose();
        statusLabel.textContent = translations[currentLang].status_done;
        recordBtnText.textContent = translations[currentLang].export_btn;
        btnRecord.disabled = false;
      };

      function exportRenderLoop() {
        if (!isExporting) return;
        exportCamera.position.copy(camera.position);
        exportCamera.quaternion.copy(camera.quaternion);
        exportRenderer.render(scene, exportCamera);
        requestAnimationFrame(exportRenderLoop);
      }
      exportRenderLoop();

      recorder.start();

      let remaining = durationSec;
      const timer = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          statusLabel.textContent = `⏳ ${remaining}s...`;
        } else {
          clearInterval(timer);
          isExporting = false;
          recorder.stop();
        }
      }, 1000);
    });
  </script>
</body>
</html>
