<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1e2e"/>
      <stop offset="50%" stop-color="#0d3040"/>
      <stop offset="100%" stop-color="#071824"/>
    </linearGradient>
    <linearGradient id="saturn-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cebdd"/>
      <stop offset="45%" stop-color="#3cc9d8"/>
      <stop offset="100%" stop-color="#07333f"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8f0ea"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1aa39a"/>
      <stop offset="100%" stop-color="#2087c9"/>
    </linearGradient>
    <filter id="card-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feFlood flood-color="#3cc9d8" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="420" height="120" rx="20" ry="20" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="418" height="118" rx="19" ry="19" fill="none" stroke="rgba(124,235,221,0.15)" stroke-width="1"/>

  <!-- Animated spinning card logo -->
  <g transform="translate(60, 60)" filter="url(#card-glow)">
    <!-- Card container with 3D spin animation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;0;0;0;0" dur="6s" repeatCount="indefinite"/>

      <!-- Front face of card -->
      <g>
        <rect x="-18" y="-25" width="36" height="50" rx="4" ry="4"
              fill="url(#accent-grad)" stroke="rgba(255,255,255,0.9)" stroke-width="1.2"/>
        <!-- Wireframe mesh icon -->
        <path d="M-12 12 L-8 -12 h16 l4 24 H-12z" stroke="#fff" stroke-width="1" fill="none" opacity="0.9" stroke-linejoin="round"/>
        <path d="M-10 6 h20" stroke="#fff" stroke-width="0.8" opacity="0.7"/>
        <path d="M-8 -2 h16" stroke="#fff" stroke-width="0.8" opacity="0.7"/>
        <path d="M-4 -12 l-2 24" stroke="#fff" stroke-width="0.8" opacity="0.8"/>
        <path d="M4 -12 l2 24" stroke="#fff" stroke-width="0.8" opacity="0.8"/>
        <circle cx="0" cy="-2" r="1.5" fill="#fff"/>

        <!-- Pulsing glow -->
        <rect x="-18" y="-25" width="36" height="50" rx="4" ry="4"
              fill="none" stroke="#7cebdd" stroke-width="1.5" opacity="0">
          <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="1.5;3;1.5" dur="3s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Orbiting sparkles -->
    <circle cx="22" cy="-18" r="1.2" fill="#7cebdd" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="-20" cy="20" r="0.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="15" cy="22" r="1" fill="#3cc9d8" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="1.8s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="-22" cy="-15" r="0.6" fill="#b8f0ea" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
  </g>

  <!-- CardGram text -->
  <g filter="url(#text-glow)">
    <text x="100" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
      Card<tspan fill="#7cebdd">Gram</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="100" y="80" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#7cebdd" opacity="0.7" letter-spacing="3" font-weight="300">
    eCARD STUDIO
  </text>

  <!-- Version badge -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="48" height="18" rx="9" ry="9" fill="rgba(124,235,221,0.12)" stroke="rgba(124,235,221,0.3)" stroke-width="0.8"/>
    <text x="24" y="13" font-family="'Segoe UI', monospace" font-size="10" fill="#7cebdd" text-anchor="middle" font-weight="600">v0.5.5</text>
  </g>

  <!-- Floating particles background -->
  <circle cx="350" cy="25" r="1" fill="#7cebdd" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="25;15;25" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="90" r="0.7" fill="#3cc9d8" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="90;80;90" dur="3.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="320" cy="60" r="0.5" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="400" cy="50" r="0.8" fill="#7cebdd" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- Decorative line -->
  <line x1="100" y1="115" x2="390" y2="115" stroke="url(#accent-grad)" stroke-width="0.5" opacity="0.3"/>
</svg>
